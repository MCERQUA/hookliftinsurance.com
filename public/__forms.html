<!DOCTYPE html>
<html>
<head><title>Netlify Forms</title></head>
<body>
  <form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="quote" />
    <input name="bot-field" />
    <input name="firstName" />
    <input name="lastName" />
    <input name="businessName" />
    <input name="email" />
    <input name="phone" />
    <input name="state" />
    <input name="truckType" />
    <input name="numberOfTrucks" />
    <textarea name="message"></textarea>
  <input name="streetAddress" type="text" />
  <input name="city" type="text" />
  <input name="zip" type="text" />
  <input name="fein" type="text" />
  <input name="equipmentYear" type="text" />
  <input name="equipmentMake" type="text" />
  <input name="equipmentModel" type="text" />
  <input name="equipmentSerialNumber" type="text" />
  <input name="equipmentValue" type="text" />
  </form>
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input name="bot-field" />
    <input name="name" />
    <input name="email" />
    <input name="phone" />
    <textarea name="message"></textarea>
  </form>
  <form name="coi" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="coi" />
    <input name="bot-field" />
    <input name="business_name" />
    <input name="contact_name" />
    <input name="phone" />
    <input name="email" />
    <input name="policy_number" />
    <input name="certificate_type" />
    <input name="certificate_holder" />
    <input name="certificate_holder_address" />
    <input name="project_name" />
    <textarea name="notes"></textarea>
  </form>
</body>
</html>
